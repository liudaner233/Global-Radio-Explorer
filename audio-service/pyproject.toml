[project]
name = "radio-audio-service"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.1",
  "transformers==5.6.0",
  "huggingface-hub==1.5.0",
  "safetensors==0.7.0",
  "numpy==2.3.5",
]

[dependency-groups]
dev = ["pytest==9.0.2", "soundfile==0.13.1", "scipy==1.17.0"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
